<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EAF4"/>
      <stop offset="100%" stop-color="#EDD5EC"/>
    </linearGradient>
    <linearGradient id="crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A066A0"/>
      <stop offset="100%" stop-color="#6B3F7A"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- Crown base -->
  <rect x="14" y="40" width="36" height="8" rx="2" fill="url(#crown)"/>
  <!-- Left peak -->
  <polygon points="14,40 14,26 23,34" fill="url(#crown)"/>
  <!-- Center peak -->
  <polygon points="32,40 22,18 42,18" fill="url(#crown)"/>
  <!-- Right peak -->
  <polygon points="50,40 50,26 41,34" fill="url(#crown)"/>
  <!-- Jewels -->
  <circle cx="14" cy="25" r="3" fill="#C8A0C8"/>
  <circle cx="32" cy="16" r="3.5" fill="#C8A0C8"/>
  <circle cx="50" cy="25" r="3" fill="#C8A0C8"/>
</svg>
