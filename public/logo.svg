<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" width="300" height="56" role="img" aria-label="Мария Королева — Wellness">
  <defs>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A066A0"/>
      <stop offset="100%" stop-color="#6B3F7A"/>
    </linearGradient>
  </defs>

  <!-- Crown icon -->
  <g transform="translate(4, 6)">
    <rect x="4" y="28" width="36" height="8" rx="2" fill="url(#crownGrad)"/>
    <polygon points="4,28 4,14 13,22" fill="url(#crownGrad)"/>
    <polygon points="22,28 12,10 32,10" fill="url(#crownGrad)"/>
    <polygon points="40,28 40,14 31,22" fill="url(#crownGrad)"/>
    <circle cx="4" cy="13" r="2.5" fill="#C8A0C8"/>
    <circle cx="22" cy="8" r="3" fill="#C8A0C8"/>
    <circle cx="40" cy="13" r="2.5" fill="#C8A0C8"/>
  </g>

  <!-- Vertical divider -->
  <line x1="60" y1="10" x2="60" y2="46" stroke="rgba(160,102,160,0.25)" stroke-width="1"/>

  <!-- Name text -->
  <text x="72" y="27" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1D1D1F" letter-spacing="1">МАРИЯ КОРОЛЕВА</text>
  <!-- Subtitle -->
  <text x="73" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#9B6B9A" letter-spacing="3.5">WELLNESS</text>
</svg>
